<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ Đơn Kính</title>
<style>
/* Layout: thanh trên cố định với các tab; nội dung là bảng kiểu bảng tính (kiểu A của bản thử). */
:root{
  --bg:#f4f7f8; --surface:#ffffff; --fg:#132029; --muted:#5a6a76; --line:#dbe3e8;
  --accent:#0d6b88; --accent-fg:#ffffff; --accent-weak:#e2f0f4;
  --red:#b9342a; --red-bg:#fbe8e6; --amber:#9a5c00; --amber-bg:#fff1d2; --green:#1d7448; --green-bg:#e0f3e8;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e151b; --surface:#152029; --fg:#e4ecf1; --muted:#93a3af; --line:#24333f;
  --accent:#4cb1cf; --accent-fg:#0b1a21; --accent-weak:#12303c;
  --red:#ff8c80; --red-bg:#3b1c19; --amber:#f0b44a; --amber-bg:#382a10; --green:#6ccd95; --green-bg:#132e1e; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body)}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .row{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{font-weight:700}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs a{white-space:nowrap;padding:10px 12px;border-bottom:2px solid transparent;font-weight:500;color:var(--muted);text-decoration:none;display:flex;gap:6px;align-items:center}
.tabs a.on{color:var(--fg);border-bottom-color:var(--accent)}
.count{font-size:11px;background:var(--accent-weak);color:var(--accent);border-radius:999px;padding:1px 6px}
.count.do-nen{background:var(--red-bg);color:var(--red)}
.page-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-block:18px 6px}
.page-h h1{font-size:22px;margin:0}
.page-h .grow{flex:1}
.muted{color:var(--muted)}
.saving{font-size:12px;color:var(--muted)}
.saving.ok{color:var(--green)}
.saving.err{color:var(--red)}
.loi{margin-block:8px;padding:10px 14px;border-radius:10px;background:var(--red-bg);color:var(--red)}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-block:8px 40px}
table{border-collapse:collapse;width:max-content;min-width:100%}
th{position:sticky;top:0;background:var(--surface);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap;font-weight:600}
td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:2px}
td:last-child{border-right:0}
tr.new td{background:var(--accent-weak)}
tr.new input::placeholder{color:var(--accent)}
input.cell,select.cell{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;border-radius:6px;min-width:0}
input.cell:hover,select.cell:hover{border-color:var(--line)}
input.cell:focus,select.cell:focus{border-color:var(--accent);background:var(--surface);outline:none}
input.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sec-h{font-size:16px;margin:22px 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sec-h .muted{font-size:13px;font-weight:500}
.do{color:var(--red)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;margin-block:8px 40px}
.btn{white-space:nowrap;font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:500;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.small{padding:3px 9px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.flash{margin-block:12px;padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.flash.loi{background:var(--red-bg);color:var(--red)}
.flash.ok{background:var(--green-bg);color:var(--green)}
.flash .btn:first-of-type{margin-left:auto}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.qua{background:var(--red-bg);color:var(--red)}
.chip.gan{background:var(--amber-bg);color:var(--amber)}
.chip.sap{background:var(--green-bg);color:var(--green)}
.chip.xa{background:var(--accent-weak);color:var(--accent)}
tr.u-sap td.hen{background:var(--green-bg)}
td.act{white-space:nowrap;padding:2px 6px}
tr.u-qua td.hen{background:var(--red-bg)}
tr.u-gan td.hen{background:var(--amber-bg)}
td.thieu{background:var(--red-bg)}
td.thieu .cell{border-color:var(--red)}
.ph-nhom{display:flex;gap:3px;padding:2px}
.ph{font:inherit;font-size:12px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:2px 8px;cursor:pointer;white-space:nowrap}
.ph:hover{border-color:var(--accent)}
.ph.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.ph.on.su-co{background:var(--red);border-color:var(--red);color:var(--surface)}
td.thieu .ph-nhom{outline:1px solid var(--red);border-radius:999px}
.w-ph{width:270px}
.lich-dau{display:flex;align-items:center;gap:10px;margin-block:8px}
.lich{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:640px;margin-bottom:8px}
.lich .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.lich button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 4px;min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.lich button:hover{border-color:var(--accent)}
.lich .d{font-weight:600}
.lich .n{font-size:11px;color:var(--muted)}
.lich button.co .n{color:var(--accent);font-weight:600}
.lich button.chon{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-weak)}
.lich button.nay .d{color:var(--accent)}
.loc{display:flex;gap:8px;flex-wrap:wrap;margin-block:8px}
.loc input,.loc select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.loc .tim{flex:1;min-width:0;max-width:360px}
.top .grow{flex:1}
.dang-nhap{min-height:100vh;display:grid;place-items:center;padding-block:32px}
.dang-nhap form{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:8px}
.dang-nhap h1{margin:0;font-size:24px}
.dang-nhap p{margin:0 0 8px}
.dang-nhap label{font-size:12px;color:var(--muted);font-weight:500;margin-top:6px}
.dang-nhap input{font:inherit;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.dang-nhap input:focus{border-color:var(--accent);outline:none}
.btn.chinh{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);padding:9px 12px;margin-top:10px}
.nho{font-size:12px}
/* ---- Điện thoại: thẻ + form ---- */
.the-moi{margin-block:8px}
.the-moi .cell{border:1px dashed var(--accent);background:var(--accent-weak);padding:10px 12px;font-size:15px}
.the-moi .cell::placeholder{color:var(--accent)}
.ds-the{display:flex;flex-direction:column;gap:8px;margin-block:8px 28px}
.the{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.the.u-qua{border-left:4px solid var(--red)}
.the.co-thieu .the-than .ten{color:var(--red)}
.the.u-gan{border-left:4px solid var(--amber)}
.the-than{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:3px;padding:12px 14px;width:100%;cursor:pointer}
.the-than:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.the .ten{font-weight:600;font-size:15px}
.the .phu{font-size:13px;color:var(--muted)}
.the .do-kinh{font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.the-chan{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--line)}
.the-chan .grow{flex:1}
.chip.tron{background:transparent;border:1px solid var(--line);color:var(--muted)}
.chip.xong{background:var(--green-bg);color:var(--green)}
.man{position:fixed;inset:0;background:rgba(10,20,28,.4);z-index:30}
.form-don{position:fixed;inset:0;z-index:31;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.form-don header{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.form-don header h2{margin:0;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-don .than{overflow-y:auto;flex:1;padding:4px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.form-don section{margin-block:14px}
.form-don h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px;font-weight:600}
.form-don .luoi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form-don .truong{display:flex;flex-direction:column;gap:3px;min-width:0}
.form-don .truong.rong{grid-column:1/-1}
.form-don label{font-size:12px;color:var(--muted)}
.form-don .cell{border:1px solid var(--line);background:var(--surface);padding:9px 10px;font-size:15px}
.form-don .truong.thieu .cell,.form-don .truong.thieu .ph-nhom{border-color:var(--red);background:var(--red-bg)}
.form-don .ph-nhom{flex-wrap:wrap;gap:6px}
.form-don .ph{font-size:14px;padding:7px 14px}
.form-don footer{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.form-don footer .grow{flex:1}
@media (max-width:760px){
  .brand{display:none}
  .top .row{gap:8px}
  .page-h h1{font-size:20px}
}
.w-ten{width:180px}.w-sm{width:64px}.w-rx{width:140px}.w-md{width:130px}.w-lg{width:200px}.w-date{width:140px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
